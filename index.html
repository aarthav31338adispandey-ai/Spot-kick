<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spot Kick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: portrait night-match view from behind the penalty spot; HUD floats over a full-bleed canvas. Single dark look by choice. */
:root {
  --bg: #07130d;
  --pitch: #14622f;
  --ink: #f6f3ea;
  --ink-dim: #9fc3ad;
  --accent: #ffd23f;
  --line: #2c7a47;
  --panel: rgba(7, 19, 13, 0.82);
  --font-display: "Bebas Neue", Impact, "Arial Narrow Bold", sans-serif;
  --font-body: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  align-items: center;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
.stage {
  position: relative;
  width: min(100%, 440px, calc((100dvh - 28px) * 300 / 420));
  aspect-ratio: 300 / 420;
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  background: var(--pitch);
  box-shadow: 0 0 0 2px var(--line), 0 18px 50px rgba(0, 0, 0, 0.6);
  cursor: pointer;
  outline: none;
}
.stage:focus-visible { box-shadow: 0 0 0 3px var(--accent), 0 18px 50px rgba(0, 0, 0, 0.6); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; left: 0; right: 0; top: 0;
  padding: 12px 14px 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.score { font-family: var(--font-display); font-size: clamp(46px, 14vw, 66px); line-height: 0.9; color: var(--ink); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.meta { margin-top: 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; display: flex; gap: 12px; }
.lives { color: var(--accent); letter-spacing: 0.2em; }
.mute {
  pointer-events: auto;
  font: 500 11px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-dim); background: rgba(7,19,13,0.6);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer;
}
.mute:hover { color: var(--ink); border-color: var(--accent); }
.mute:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink);
  text-shadow: 0 1px 3px rgba(0,0,0,0.7); pointer-events: none;
}
.panel {
  position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
  width: min(86%, 340px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px 14px; text-align: center;
  backdrop-filter: blur(4px);
}
.panel h1, .panel h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 12vw, 50px); line-height: 0.95; letter-spacing: 0.03em; color: var(--accent); text-wrap: balance; }
.panel p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--ink); }
.panel .cta { margin: 10px 0 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.panel .nums { display: flex; justify-content: center; gap: 22px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.panel .nums b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; color: var(--ink); }
.panel .nums span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.newbest { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin: 2px 0 6px; }
</style>

<div class="stage" id="stage" tabindex="0" role="application" aria-label="Spot Kick penalty game. Press space or tap to lock your aim.">
  <canvas id="c"></canvas>
  <div class="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="meta"><span>Best <span id="best">0</span></span><span class="lives" id="lives" aria-label="Lives left">&#9679;&#9679;&#9679;</span></div>
    </div>
    <button class="mute" id="mute" type="button" aria-pressed="false">Sound on</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="panel" id="intro">
    <h1>Spot Kick</h1>
    <p>Tap once to lock the sideways aim, tap again to lock the height. Corners beat the keeper and score double. Three misses and the match is over.</p>
    <div class="cta">Tap to take the first kick</div>
  </div>
  <div class="panel" id="over" hidden>
    <h2>Full time</h2>
    <div class="newbest" id="newbest" hidden>New best</div>
    <div class="nums">
      <div><b id="finalScore">0</b><span>Points</span></div>
      <div><b id="finalBest">0</b><span>Best</span></div>
      <div><b id="finalGoals">0</b><span>Goals</span></div>
    </div>
    <div class="cta">Tap for another shootout</div>
  </div>
</div>

<script>
(function () {
  var W = 300, H = 420;
  var POST_L = 46, POST_R = 254, BAR_Y = 122, GROUND_Y = 226;
  var SPOT_X = 150, SPOT_Y = 372;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var elScore = document.getElementById('score'), elBest = document.getElementById('best');
  var elLives = document.getElementById('lives'), elHint = document.getElementById('hint');
  var intro = document.getElementById('intro'), over = document.getElementById('over');
  var muteBtn = document.getElementById('mute');

  var phase = 'ready'; // ready, aimX, aimY, shot, result, over
  var lockUntil = 0, score = 0, goals = 0, lives = 3, shots = 0, best = 0;
  var aim = { x: 150, dx: 1, y: 160, dy: 1, lx: 0, ly: 0 };
  var shot = null, keeper, ball, resultText = '', resultT = 0, resultKind = '', flash = 0;
  var crowd = [];
  for (var i = 0; i < 260; i++) crowd.push({ x: Math.random() * W, y: 8 + Math.random() * 80, h: Math.floor(Math.random() * 360), l: 30 + Math.random() * 30 });

  try { best = parseInt(localStorage.getItem('spotkick-best') || '0', 10) || 0; } catch (e) {}
  elBest.textContent = best;

  /* ---------- sound ---------- */
  var ac = null, muted = false;
  function tone(freq, dur, type, vol, delay) {
    if (muted) return;
    setTimeout(function () {
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
        o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol || 0.05, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
      } catch (e) {}
    }, delay || 0);
  }
  muteBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  muteBtn.addEventListener('keydown', function (e) { e.stopPropagation(); });
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', String(muted));
  });

  /* ---------- game ---------- */
  function setLives() {
    var s = '';
    for (var i = 0; i < 3; i++) s += i < lives ? '●' : '○';
    elLives.textContent = s;
  }
  function hint(t) { elHint.textContent = t; }

  function newGame() {
    score = 0; goals = 0; lives = 3; shots = 0;
    elScore.textContent = '0'; setLives();
    nextKick();
  }

  function nextKick() {
    phase = 'aimX';
    aim.x = 40 + Math.random() * 220; aim.dx = Math.random() < 0.5 ? 1 : -1;
    aim.y = 110 + Math.random() * 100; aim.dy = Math.random() < 0.5 ? 1 : -1;
    keeper = { x: 150, y: GROUND_Y - 30, a: 0 };
    ball = { x: SPOT_X, y: SPOT_Y, s: 1, rot: 0, vx: 0, vy: 0 };
    shot = null; resultText = ''; resultKind = '';
    hint('Tap to lock sideways aim');
  }

  function kick() {
    var tx = aim.lx, ty = aim.ly;
    var pRead = Math.min(0.12 + shots * 0.03, 0.5);
    var gx, gy;
    if (Math.random() < pRead) {
      gx = tx + (Math.random() - 0.5) * 20; gy = ty + (Math.random() - 0.5) * 20;
    } else {
      gx = 64 + Math.random() * 172; gy = 140 + Math.random() * 84;
    }
    gx = Math.max(56, Math.min(244, gx)); gy = Math.max(138, Math.min(224, gy));
    var inGoal = tx >= POST_L + 4 && tx <= POST_R - 4 && ty >= BAR_Y + 3;
    var kind;
    if (!inGoal) kind = ty < BAR_Y + 3 ? 'over' : 'wide';
    else if (Math.hypot(gx - tx, gy - ty) < 44) kind = 'saved';
    else kind = 'goal';
    shot = { tx: tx, ty: ty, gx: gx, gy: gy, t: 0, kind: kind };
    phase = 'shot';
    hint('');
    shots++;
    tone(120, 0.12, 'sine', 0.12);
    tone(90, 0.1, 'triangle', 0.1, 30);
  }

  function resolve() {
    phase = 'result'; resultT = 0;
    var k = shot.kind;
    resultKind = k;
    if (k === 'goal') {
      var corner = shot.tx < 78 || shot.tx > 222;
      var pts = corner ? 2 : 1;
      score += pts; goals++;
      elScore.textContent = score;
      resultText = corner ? 'GOLAZO +2' : 'GOAL +1';
      flash = 1;
      tone(523, 0.14, 'triangle', 0.08); tone(659, 0.14, 'triangle', 0.08, 110); tone(784, 0.3, 'triangle', 0.09, 220);
    } else {
      lives--; setLives();
      resultText = k === 'saved' ? 'SAVED' : k === 'over' ? 'OVER THE BAR' : 'WIDE';
      ball.vx = k === 'saved' ? (shot.tx < 150 ? -1.6 : 1.6) : (shot.tx < 150 ? -0.8 : 0.8);
      ball.vy = k === 'saved' ? -2.2 : -1.6;
      tone(180, 0.25, 'sawtooth', 0.06); tone(130, 0.3, 'sawtooth', 0.06, 130);
    }
  }

  function endGame() {
    phase = 'over';
    lockUntil = performance.now() + 700;
    var isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('spotkick-best', String(best)); } catch (e) {} }
    elBest.textContent = best;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('finalGoals').textContent = goals;
    document.getElementById('newbest').hidden = !(isBest && score > 0);
    hint('');
    tone(392, 0.2, 'triangle', 0.07); tone(392, 0.2, 'triangle', 0.07, 200); tone(330, 0.5, 'triangle', 0.07, 400);
    over.hidden = false;
  }

  function action() {
    if (performance.now() < lockUntil) return;
    if (phase === 'ready') { intro.hidden = true; newGame(); }
    else if (phase === 'aimX') { aim.lx = aim.x; phase = 'aimY'; hint('Tap to lock height'); tone(440, 0.05, 'square', 0.04); }
    else if (phase === 'aimY') { aim.ly = aim.y; kick(); }
    else if (phase === 'over') { over.hidden = true; newGame(); }
  }

  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); stage.focus({ preventScroll: true }); action(); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
  });

  /* ---------- drawing ---------- */
  function resize() {
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener('resize', resize);

  function drawBall(x, y, s, rot) {
    var r = 11 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    if (s > 0.5) { ctx.beginPath(); ctx.ellipse(2 * s, r + 2, r * 0.9, r * 0.28, 0, 0, 6.2832); ctx.fill(); }
    ctx.fillStyle = '#fbfaf5';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#20212b';
    ctx.rotate(rot);
    for (var i = 0; i < 5; i++) {
      var a = i * 1.2566;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.24, 0, 6.2832); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
  }

  function drawKeeper() {
    ctx.save();
    ctx.translate(keeper.x, keeper.y);
    ctx.rotate(keeper.a);
    ctx.fillStyle = '#1d2433'; ctx.fillRect(-9, 8, 7, 24); ctx.fillRect(2, 8, 7, 24);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-11, -22, 22, 32);
    ctx.fillStyle = '#e0b21f'; ctx.fillRect(-11, 4, 22, 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-30, -20, 60, 7);
    ctx.fillStyle = '#ff5a3c'; ctx.beginPath(); ctx.arc(-32, -16.5, 5, 0, 6.2832); ctx.arc(32, -16.5, 5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e9b88f'; ctx.beginPath(); ctx.arc(0, -30, 8, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#2b1f17'; ctx.beginPath(); ctx.arc(0, -33, 8, Math.PI, 0); ctx.fill();
    ctx.restore();
  }

  function drawScene() {
    var s = cv.width / W;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    // stands
    var sg = ctx.createLinearGradient(0, 0, 0, 100);
    sg.addColorStop(0, '#0a1220'); sg.addColorStop(1, '#16233a');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, 100);
    for (var i = 0; i < crowd.length; i++) {
      var c = crowd[i];
      ctx.fillStyle = 'hsl(' + c.h + ',55%,' + Math.min(80, c.l + flash * 30) + '%)';
      ctx.fillRect(c.x, c.y, 3, 3);
    }
    ctx.fillStyle = '#0f1a14'; ctx.fillRect(0, 92, W, 10);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, 100, W, 2);
    // pitch stripes
    for (i = 0; i < 9; i++) {
      ctx.fillStyle = i % 2 ? '#14622f' : '#188037';
      ctx.fillRect(0, 102 + i * 40, W, 40);
    }
    var vg = ctx.createRadialGradient(150, 250, 40, 150, 250, 260);
    vg.addColorStop(0, 'rgba(255,255,255,0.08)'); vg.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = vg; ctx.fillRect(0, 102, W, H - 102);
    // markings
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, GROUND_Y); ctx.lineTo(8, 262); ctx.lineTo(292, 262); ctx.lineTo(276, GROUND_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, 262); ctx.lineTo(-20, 404); ctx.moveTo(292, 262); ctx.lineTo(320, 404); ctx.stroke();
    ctx.beginPath(); ctx.arc(SPOT_X, 332, 62, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(SPOT_X, SPOT_Y + 12, 3, 0, 6.2832); ctx.fill();
    // net back
    ctx.fillStyle = 'rgba(8,16,12,0.55)';
    ctx.beginPath(); ctx.moveTo(POST_L, BAR_Y); ctx.lineTo(POST_R, BAR_Y); ctx.lineTo(POST_R - 10, GROUND_Y - 8); ctx.lineTo(POST_L + 10, GROUND_Y - 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    for (i = 0; i <= 14; i++) {
      var nx = POST_L + (POST_R - POST_L) * i / 14, bx = POST_L + 10 + (POST_R - POST_L - 20) * i / 14;
      ctx.beginPath(); ctx.moveTo(nx, BAR_Y); ctx.lineTo(bx, GROUND_Y - 8); ctx.stroke();
    }
    for (i = 0; i <= 7; i++) {
      var ny = BAR_Y + (GROUND_Y - 8 - BAR_Y) * i / 7;
      ctx.beginPath(); ctx.moveTo(POST_L + 10 * i / 7, ny); ctx.lineTo(POST_R - 10 * i / 7, ny); ctx.stroke();
    }
    // keeper then posts
    if (keeper) drawKeeper();
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(POST_L, GROUND_Y); ctx.lineTo(POST_L, BAR_Y); ctx.lineTo(POST_R, BAR_Y); ctx.lineTo(POST_R, GROUND_Y); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawAim() {
    if (phase === 'aimX') {
      ctx.strokeStyle = 'rgba(255,210,63,0.9)'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(aim.x, 98); ctx.lineTo(aim.x, GROUND_Y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.moveTo(aim.x - 7, 98); ctx.lineTo(aim.x + 7, 98); ctx.lineTo(aim.x, 108); ctx.closePath(); ctx.fill();
    } else if (phase === 'aimY') {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(aim.lx, 98); ctx.lineTo(aim.lx, GROUND_Y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,210,63,0.95)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(14, aim.y); ctx.lineTo(W - 14, aim.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(aim.lx, aim.y, 6, 0, 6.2832); ctx.fill();
    }
  }

  function drawResultText() {
    if (phase !== 'result') return;
    var k = Math.min(1, resultT / 12);
    var good = resultKind === 'goal';
    ctx.save();
    ctx.textAlign = 'center';
    ctx.translate(W / 2, 292);
    ctx.scale(0.7 + 0.3 * k, 0.7 + 0.3 * k);
    ctx.font = '46px "Bebas Neue", Impact, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(resultText, 0, 0);
    ctx.fillStyle = good ? '#ffd23f' : '#ff6b5b';
    ctx.fillText(resultText, 0, 0);
    ctx.restore();
  }

  /* ---------- loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(32, now - last) / 16.667;
    last = now;
    var sp = shots;

    if (phase === 'aimX') {
      var vx = Math.min(3.2 + sp * 0.12, 8);
      aim.x += aim.dx * vx * dt;
      if (aim.x > 282) { aim.x = 282; aim.dx = -1; }
      if (aim.x < 18) { aim.x = 18; aim.dx = 1; }
    } else if (phase === 'aimY') {
      var vy = Math.min(2.4 + sp * 0.1, 6);
      aim.y += aim.dy * vy * dt;
      if (aim.y > 226) { aim.y = 226; aim.dy = -1; }
      if (aim.y < 100) { aim.y = 100; aim.dy = 1; }
    } else if (phase === 'shot') {
      shot.t += dt / 34;
      var t = Math.min(1, shot.t), e = 1 - Math.pow(1 - t, 1.5);
      ball.x = SPOT_X + (shot.tx - SPOT_X) * e;
      ball.y = SPOT_Y + (shot.ty - SPOT_Y) * e - Math.sin(Math.PI * t) * 34;
      ball.s = 1 - 0.58 * e;
      ball.rot += 0.35 * dt;
      var kt = Math.min(1, shot.t * 1.5), ke = 1 - Math.pow(1 - kt, 2);
      keeper.x = 150 + (shot.gx - 150) * ke;
      keeper.y = (GROUND_Y - 30) + (shot.gy - (GROUND_Y - 30)) * ke * 0.8;
      keeper.a = Math.max(-1.1, Math.min(1.1, ((shot.gx - 150) / 100) * 1.0)) * ke;
      if (shot.t >= 1) { ball.x = shot.tx; ball.y = shot.ty; ball.s = 0.42; resolve(); }
    } else if (phase === 'result') {
      resultT += dt;
      if (resultKind === 'goal') {
        ball.x = shot.tx + Math.sin(resultT * 0.9) * 1.2 * Math.max(0, 1 - resultT / 30);
        ball.y = shot.ty + Math.min(resultT * 0.3, 8);
      } else {
        ball.vy += 0.1 * dt;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        ball.rot += 0.2 * dt;
      }
      if (resultT > 62) {
        if (lives <= 0) endGame(); else nextKick();
      }
    }
    if (flash > 0) flash = Math.max(0, flash - 0.02 * dt);

    drawScene();
    drawAim();
    if (ball) drawBall(ball.x, ball.y, ball.s, ball.rot);
    drawResultText();
    requestAnimationFrame(frame);
  }

  resize();
  keeper = { x: 150, y: GROUND_Y - 30, a: 0 };
  ball = { x: SPOT_X, y: SPOT_Y, s: 1, rot: 0, vx: 0, vy: 0 };
  setLives();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
